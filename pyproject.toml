[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nlp-workbench"
version = "1.0.0"
description = "A configurable, hardware-aware NLP experimentation workbench for research and Gemastik Data Mining preparation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "NLP Research Engineer"}
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "torch>=2.0.0",
    "transformers>=4.36.0",
    "sentence-transformers>=2.3.0",
    "datasets>=2.16.0",
    "accelerate>=0.25.0",
    "pyarrow>=12.0.0",
    "seqeval>=1.2.2",
    "evaluate>=0.4.0",
    "rouge-score>=0.1.2",
    "sacrebleu>=2.4.0",
    "rank-bm25>=0.2.2",
    "optuna>=3.5.0",
    "joblib>=1.3.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: requires internet access to download Hugging Face models",
    "cuda: requires a CUDA-enabled GPU"
]
